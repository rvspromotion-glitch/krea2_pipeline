name: Build & Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # The CUDA devel base is tens of GB unpacked and a hosted runner only has
      # ~14GB free. Dropping the preinstalled toolchains we do not use buys back
      # enough room; without this the build dies on "no space left on device"
      # partway through pulling the base layer.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push worker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # The commit tag is the one that matters. RunPod caches by tag, so an
          # endpoint pinned to :latest can keep serving a stale image after a
          # push — point the endpoint at a specific sha instead, and rolling
          # back is just selecting the previous one.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image pushed
        run: |
          echo "Deploy this tag on the RunPod endpoint:"
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:${{ github.sha }}"
