name: Build & Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Cheap, and it saves finding out from a failed push at the end of a long
      # build. Model-host tokens are not needed here — the weights are fetched
      # by the worker at container start, not baked in.
      - name: Check the secrets this build needs
        run: |
          missing=""
          [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "${{ secrets.DOCKERHUB_TOKEN }}"    ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # The image is ~8GB: torch, ComfyUI and the custom nodes. That does not
      # fit in the ~14GB free on / alongside the build cache, but /mnt is large
      # and near-empty, so Docker's storage moves there. (The models used to be
      # baked in too, at ~18GB more — that is what did not fit at all, and is
      # why they are fetched at container start instead.)
      - name: Make room for the build
        run: |
          echo "── before ──"; df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules /opt/hostedtoolcache \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true

          # docker.socket restarts the daemon on demand, so it has to go down
          # too or the config change is reverted out from under us.
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'docker root: {{.DockerRootDir}}'

          echo "── after ──"; df -h / /mnt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # The commit tag is the one that matters. RunPod caches by tag, so an
          # endpoint pinned to :latest can keep serving a stale image after a
          # push — point the endpoint at a specific sha instead, and rolling
          # back is just selecting the previous one.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:${{ github.sha }}
          # Registry cache, not type=gha: the GitHub Actions cache is capped at
          # 10GB per repository, and the torch layer alone is most of that.
          # A dedicated Docker Hub tag holds it instead, which is what turns a
          # code-only change into a few-minute build.
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:buildcache,mode=max

      - name: Image pushed
        run: |
          echo "Deploy this tag on the RunPod endpoint:"
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:${{ github.sha }}"
          echo
          echo "The endpoint needs CIVITAI_TOKEN set as an environment variable —"
          echo "the worker fetches the weights on cold start, not at build time."
