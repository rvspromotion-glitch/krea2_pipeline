name: Build & Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Models are downloaded and layers are pushed inside this job; a cold build
    # is comfortably over an hour.
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # This image carries ~18GB of models plus torch. A hosted runner has about
      # 14GB free on / and a much larger, near-empty /mnt, so the build needs
      # both: delete what we do not use, and move Docker's storage to /mnt.
      # Without this the build dies on "no space left on device" somewhere in
      # the middle of the checkpoint download, which looks like a network fault.
      - name: Make room for the build
        run: |
          echo "── before ──"; df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules /opt/hostedtoolcache \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true

          # docker.socket restarts the daemon on demand, so it has to go down
          # too or the config change is reverted out from under us.
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'docker root: {{.DockerRootDir}}'

          echo "── after ──"; df -h / /mnt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # Model-host tokens, never build args: an ARG is recorded in the layer
          # history of the stage that declares it.
          secrets: |
            civitai_token=${{ secrets.CIVITAI_TOKEN }}
            hf_token=${{ secrets.HF_TOKEN }}
          # The commit tag is the one that matters. RunPod caches by tag, so an
          # endpoint pinned to :latest can keep serving a stale image after a
          # push — point the endpoint at a specific sha instead, and rolling
          # back is just selecting the previous one.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:${{ github.sha }}
          # Registry cache, not type=gha: the GitHub Actions cache is capped at
          # 10GB per repository, so caching an 18GB image there would thrash and
          # evict itself on every run while still uploading the whole thing.
          # A dedicated Docker Hub tag holds it instead, which is what turns a
          # code-only change into a few-minute build.
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:buildcache,mode=max

      - name: Image pushed
        run: |
          echo "Deploy this tag on the RunPod endpoint:"
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/krea2-worker:${{ github.sha }}"
